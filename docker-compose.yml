services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amanda-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SITE_URL: https://amandaclothing.cloud
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.amanda-api.rule=Host(`api.amandaclothing.cloud`)"
      - "traefik.http.routers.amanda-api.entrypoints=websecure"
      - "traefik.http.routers.amanda-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.amanda-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: https://api.amandaclothing.cloud
    container_name: amanda-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.amanda-web.rule=Host(`amandaclothing.cloud`) || Host(`www.amandaclothing.cloud`)"
      - "traefik.http.routers.amanda-web.entrypoints=websecure"
      - "traefik.http.routers.amanda-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.amanda-web.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
    name: traefik
